services:
    plant-sync-web.migrate:
        # One-shot: applies Prisma migrations, then exits. Uses the builder stage for the Prisma CLI.
        build:
            context: .
            dockerfile: Dockerfile
            target: builder
        container_name: plant-sync-web.migrate
        command: npx prisma migrate deploy
        environment:
            DATABASE_URL: postgresql://${DB_USERNAME:-plant_sync_web}:${DB_PASSWORD:-secret}@plant-sync-web.database:5432/${DB_DATABASE:-plant_sync_web}?schema=public
        depends_on:
            plant-sync-web.database:
                condition: service_healthy
        networks:
            - plant-sync-web-network

    plant-sync-web.app:
        build:
            context: .
            dockerfile: Dockerfile
        image: ${DOCKER_REGISTRY-}plant-sync-web-app
        container_name: plant-sync-web.app
        restart: unless-stopped
        environment:
            DATABASE_URL: postgresql://${DB_USERNAME:-plant_sync_web}:${DB_PASSWORD:-secret}@plant-sync-web.database:5432/${DB_DATABASE:-plant_sync_web}?schema=public
            # Required: openssl rand -base64 48
            AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (openssl rand -base64 48)}
            # Optional: when set, ESP32 requests must send an `X-Device-Key` header
            DEVICE_API_KEY: ${DEVICE_API_KEY:-}
            # An https URL marks the session cookie Secure; leave empty for plain HTTP on a LAN
            NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        ports:
            # The ESP32 firmware calls http://<host>/api/... (port 80 by default); change the
            # left side to 80 or update `apiUrl` in esp32/esp32.cpp.
            - "${APP_PORT:-8000}:3000"
        depends_on:
            plant-sync-web.migrate:
                condition: service_completed_successfully
        networks:
            - plant-sync-web-network

    plant-sync-web.database:
        image: postgres:17
        container_name: plant-sync-web.database
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-plant_sync_web}
            POSTGRES_USER: ${DB_USERNAME:-plant_sync_web}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - dbdata:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-plant_sync_web} -d ${DB_DATABASE:-plant_sync_web}"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - plant-sync-web-network

networks:
    plant-sync-web-network:
        driver: bridge

volumes:
    dbdata:
